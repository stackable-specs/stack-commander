version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.6
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
lint:
  enabled:
    - eslint@9.39.1
    - prettier@3.8.3
    - markdownlint@0.48.0
    - yamllint@1.38.0
    - hadolint@2.14.0
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - actionlint@1.7.12
    - gitleaks@8.30.1
  ignore:
    - linters: [ALL]
      paths:
        - node_modules/**
        - dist/**
        - docs-site/**
        - reports/**
        - .trunk/out/**
        - bun.lock
    - linters: [markdownlint]
      paths:
        - docs/adr/**
        - docs/specs/**
actions:
  enabled:
    - trunk-announce
    - trunk-upgrade-available
