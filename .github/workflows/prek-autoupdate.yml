name: prek auto-update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned prek
        run: cargo install --locked --git https://github.com/j178/prek --tag v0.3.10 prek
      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run prek auto-update
        run: prek auto-update
      - name: Open PR with hook upgrades
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/prek-autoupdate
          title: 'chore(prek): auto-update hook revisions'
          body: |
            Automated `prek auto-update` run.

            Per ADR-0012 and `docs/specs/quality/prek.md` rule 12, hook
            revisions are refreshed on a weekly cadence. Review the diff
            before merging.
          commit-message: 'chore(prek): auto-update hook revisions'
          labels: dependencies,prek
