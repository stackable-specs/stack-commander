name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.2.21'

jobs:
  renovate-config:
    name: Renovate config validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes --package renovate -- renovate-config-validator --strict renovate.json

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @commitlint/cli@20.5.2 @commitlint/config-conventional@20.5.0
      - run: >
          npx commitlint
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"
          --verbose

  prek:
    name: prek run --all-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: trunk-io/trunk-action/setup@v1
      - name: Add trunk to PATH
        run: echo "$HOME/.local/share/trunk/bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - name: Install pinned prek
        run: cargo install --locked --git https://github.com/j178/prek --tag v0.3.10 prek
      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run prek
        run: prek run --all-files --show-diff-on-failure

  quality:
    name: Lint, typecheck, docs, and unit/property tests
    runs-on: ubuntu-latest
    needs: [prek]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format
      - run: bun run docs:check
      - run: bun run test:ci

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:integration

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    needs: [quality]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run test:smoke

  docker:
    name: Build image, generate SBOM, and scan
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: typescript-bun-stack:${{ github.sha }}
          provenance: false
          sbom: false
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: typescript-bun-stack:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
